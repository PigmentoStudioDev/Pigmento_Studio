name: CI

# Sin filtros de path a proposito. Un required check con paths solo se dispara
# cuando el PR toca esas rutas; en los demas queda "expected" para siempre y el PR
# se cuelga sin poder mergear. Corre siempre, aunque sea para decir que si.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Los postinstall de @carbon/* y @ibm/* son telemetria de IBM, que solo recolecta
  # en CI. pnpm ya los bloquea via ignoredBuiltDependencies; esto es el cinturon.
  IBM_TELEMETRY_DISABLED: 'true'

  # Una base de usar y tirar. Desde que la home lee el portfolio del CMS, el
  # prerenderizado CONSULTA en tiempo de build: sin base, el gate 1 no compila.
  # Darsela ademas hace util el C5 de migraciones, que sin DATABASE_URI se salta.
  # El fichero cae bajo *.db en .gitignore, asi que C4 sigue verde.
  DATABASE_URI: 'file:./ci.db'
  # No es un secreto: es CI, sin datos y sin dominio. El real vive en Vercel.
  PAYLOAD_SECRET: 'ci-no-es-un-secreto-esta-base-se-tira'

jobs:
  # El nombre de este job es el contexto que exige la proteccion de main. Cambiarlo
  # sin actualizar la regla deja main sin gate.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # 24 y no 22: es la version con la que compila Vercel. Con dos versiones
      # distintas, "verde en CI" deja de garantizar "verde en el deploy", que es
      # justo la divergencia que gates.sh existe para evitar. La fija tambien
      # `engines.node` en package.json, que es lo que lee Vercel.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      # Las migraciones ANTES del build, que es el orden de produccion: el esquema
      # tiene que existir antes de que nadie consulte. Es el unico paso que CI
      # hace de mas, y hace de menos quien lo omita.
      - name: Migrar
        run: pnpm payload migrate

      # Un solo entrypoint, el mismo que en local (CLAUDE.md > Como se verifica).
      # Si CI corriera sus propios pasos, "verde en mi maquina" y "verde en CI"
      # podrian divergir sin que nadie lo note.
      - name: Gates
        run: ./scripts/gates.sh
